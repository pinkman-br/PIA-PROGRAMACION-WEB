<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración | Seminuevos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin-autos.css">
</head>
<body class="admin">
  <!-- Panel de administración (responsable: Persona 4). Solo administrador. Aquí llega el admin al iniciar sesión. -->
  <nav id="menu-admin"></nav>

  <main class="container py-4 py-md-5">
    <h1 class="h2 admin-titulo mb-2">Panel de administración</h1>
    <p class="text-secondary mb-4" id="saludo">Opciones principales</p>

    <div class="row g-4">
      <div class="col-md-4">
        <a href="/admin/automoviles" class="card admin-tarjeta panel-opcion h-100 text-decoration-none text-body">
          <div class="card-body p-4">
            <h2 class="h5 fw-bold">Automóviles</h2>
            <p class="text-secondary small">Consultar, agregar y editar unidades.</p>
            <p class="mb-3"><span class="panel-cifra" id="numDisponibles">–</span> <span class="text-secondary">disponibles</span>
              · <span id="numVendidos">–</span> vendidos</p>
            <span class="btn btn-outline-primary btn-sm px-4">Entrar</span>
          </div>
        </a>
      </div>
      <div class="col-md-4">
        <a href="/admin/citas" class="card admin-tarjeta panel-opcion h-100 text-decoration-none text-body">
          <div class="card-body p-4">
            <h2 class="h5 fw-bold">Citas</h2>
            <p class="text-secondary small">Confirmar y dar seguimiento a pruebas de manejo.</p>
            <p class="mb-3 text-secondary small">Solicitudes de los usuarios.</p>
            <span class="btn btn-outline-primary btn-sm px-4">Entrar</span>
          </div>
        </a>
      </div>
      <div class="col-md-4">
        <a href="/admin/usuarios" class="card admin-tarjeta panel-opcion h-100 text-decoration-none text-body">
          <div class="card-body p-4">
            <h2 class="h5 fw-bold">Usuarios</h2>
            <p class="text-secondary small">Consultar cuentas registradas.</p>
            <p class="mb-3"><span class="panel-cifra" id="numUsuarios">–</span> <span class="text-secondary">cuentas</span></p>
            <span class="btn btn-outline-primary btn-sm px-4">Entrar</span>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/menu-admin.js"></script>
  <script src="/js/autos.js"></script>
  <script src="/js/admin-panel.js"></script>
</body>
</html>
