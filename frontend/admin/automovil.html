<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar / editar automóvil | Seminuevos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin-autos.css">
</head>
<body class="admin">
  <!-- Pantalla Agregar / editar automóvil (responsable: Persona 4). Solo administrador.
       /admin/automovil        → agregar
       /admin/automovil?id=3   → editar el automóvil 3 -->
  <nav id="menu-admin"></nav>

  <main class="container py-4 py-md-5">
    <h1 class="h2 admin-titulo mb-4" id="titulo">Agregar automóvil</h1>

    <div id="aviso" class="alert d-none" role="alert"></div>

    <form id="formAuto" class="card admin-tarjeta" novalidate>
      <fieldset id="campos" class="card-body p-4" disabled>
        <h2 class="h6 fw-bold text-secondary text-uppercase mb-3">Datos principales</h2>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label for="marca" class="form-label">Marca</label>
            <input class="form-control" id="marca" name="marca" list="listaMarcas" maxlength="50" required>
            <datalist id="listaMarcas"></datalist>
            <div class="invalid-feedback">Escribe la marca.</div>
          </div>
          <div class="col-md-4">
            <label for="modelo" class="form-label">Modelo</label>
            <input class="form-control" id="modelo" name="modelo" maxlength="60" required>
            <div class="invalid-feedback">Escribe el modelo.</div>
          </div>
          <div class="col-md-4">
            <label for="version" class="form-label">Versión <span class="text-secondary">(opcional)</span></label>
            <input class="form-control" id="version" name="version" maxlength="60" placeholder="Ej. Comfortline 1.4L">
          </div>
          <div class="col-6 col-md-4">
            <label for="anio" class="form-label">Año</label>
            <input type="number" class="form-control" id="anio" name="anio" min="1990" max="2100" required>
            <div class="invalid-feedback">Entre 1990 y 2100.</div>
          </div>
          <div class="col-6 col-md-4">
            <label for="precio" class="form-label">Precio (MXN)</label>
            <input type="number" class="form-control" id="precio" name="precio" min="1" step="0.01" required>
            <div class="invalid-feedback">Mayor a 0.</div>
          </div>
          <div class="col-6 col-md-4">
            <label for="kilometraje" class="form-label">Kilometraje</label>
            <input type="number" class="form-control" id="kilometraje" name="kilometraje" min="0" step="1" required>
            <div class="invalid-feedback">Número entero, 0 o más.</div>
          </div>
          <div class="col-6 col-md-4">
            <label for="color" class="form-label">Color</label>
            <input class="form-control" id="color" name="color" maxlength="30" required>
            <div class="invalid-feedback">Escribe el color.</div>
          </div>
          <div class="col-6 col-md-4">
            <label for="estatus" class="form-label">Estatus</label>
            <select class="form-select" id="estatus" name="estatus">
              <option>Disponible</option>
              <option>Vendido</option>
            </select>
          </div>
          <div class="col-6 col-md-4 d-flex align-items-end">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="destacado" name="destacado">
              <label class="form-check-label" for="destacado">Destacado en el Inicio</label>
            </div>
          </div>
        </div>

        <h2 class="h6 fw-bold text-secondary text-uppercase mb-3">Ficha técnica</h2>
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-4">
            <label for="transmision" class="form-label">Transmisión</label>
            <select class="form-select" id="transmision" name="transmision" required>
              <option>Automática</option>
              <option>Manual</option>
            </select>
          </div>
          <div class="col-6 col-md-4">
            <label for="combustible" class="form-label">Combustible</label>
            <select class="form-select" id="combustible" name="combustible" required>
              <option>Gasolina</option>
              <option>Diésel</option>
              <option>Híbrido</option>
              <option>Eléctrico</option>
            </select>
          </div>
          <div class="col-6 col-md-4">
            <label for="motor" class="form-label">Motor <span class="text-secondary">(opcional)</span></label>
            <input class="form-control" id="motor" name="motor" maxlength="60" placeholder="Ej. 1.4L turbo">
          </div>
          <div class="col-6 col-md-4">
            <label for="carroceria" class="form-label">Carrocería</label>
            <select class="form-select" id="carroceria" name="carroceria">
              <option value="">Sin especificar</option>
              <option>SUV</option>
              <option>Sedán</option>
              <option>Hatchback</option>
              <option>Pickup</option>
              <option>Minivan</option>
            </select>
          </div>
          <div class="col-6 col-md-4">
            <label for="puertas" class="form-label">Puertas</label>
            <input type="number" class="form-control" id="puertas" name="puertas" min="1" max="20">
          </div>
          <div class="col-6 col-md-4">
            <label for="pasajeros" class="form-label">Pasajeros</label>
            <input type="number" class="form-control" id="pasajeros" name="pasajeros" min="1" max="20">
          </div>
          <div class="col-12">
            <label for="descripcion" class="form-label">Descripción <span class="text-secondary">(opcional)</span></label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
          </div>
        </div>

        <h2 class="h6 fw-bold text-secondary text-uppercase mb-3">Imagen</h2>
        <div class="row g-3 align-items-start mb-4">
          <div class="col-md-6">
            <label for="imagen" class="form-label">Foto del automóvil</label>
            <input type="file" class="form-control" id="imagen" name="imagen" accept="image/jpeg,image/png,image/webp">
            <div class="form-text" id="ayudaImagen">JPG, PNG o WEBP de máximo 5 MB.</div>
          </div>
          <div class="col-md-6">
            <img class="vista-previa" id="vistaPrevia" src="/img/sin-foto.svg" alt="Vista previa de la foto">
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-verde px-4" id="btnGuardar">Guardar</button>
          <a href="/admin/automoviles" class="btn btn-outline-secondary px-4">Cancelar</a>
        </div>
      </fieldset>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/menu-admin.js"></script>
  <script src="/js/autos.js"></script>
  <script src="/js/admin-automovil.js"></script>
</body>
</html>
