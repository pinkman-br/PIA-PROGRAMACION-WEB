<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de citas | Seminuevos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/citas.css">
</head>
<body class="admin">
  <!-- Pantalla Gestión de citas (responsable: Persona 5). Solo administrador. -->
  <nav id="menu-admin"></nav>

  <main class="container py-4 py-md-5">
    <h1 class="h2 admin-titulo mb-4">Gestión de citas</h1>
    <div id="aviso" class="alert d-none" role="alert"></div>

    <form id="formBuscar" class="row g-2 align-items-center mb-3" role="search">
      <div class="col-auto"><label for="q" class="col-form-label fw-semibold">Buscar:</label></div>
      <div class="col-12 col-md"><input type="search" class="form-control" id="q" placeholder="Nombre, teléfono, correo o automóvil"></div>
      <div class="col-auto"><label for="estatus" class="col-form-label fw-semibold">Estatus:</label></div>
      <div class="col-auto">
        <select class="form-select" id="estatus">
          <option value="">Todos</option>
          <option>Pendiente</option>
          <option>Confirmada</option>
          <option>Reprogramada</option>
          <option>Cancelada</option>
        </select>
      </div>
      <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Buscar</button></div>
    </form>

    <div class="card admin-tarjeta">
      <div class="table-responsive">
        <table class="table admin-tabla mb-0">
          <thead>
            <tr><th>Usuario / contacto</th><th>Automóvil</th><th>Fecha y hora</th><th>Estatus</th><th class="text-end">Acciones</th></tr>
          </thead>
          <tbody id="tablaCitas">
            <tr><td colspan="5" class="text-center text-secondary py-4">Cargando citas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <p class="text-secondary small mt-2" id="conteo"></p>
  </main>

  <!-- Ventana: reprogramar -->
  <div class="modal fade" id="modalReprogramar" tabindex="-1" aria-labelledby="tituloReprogramar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="formReprogramar" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloReprogramar">Reprogramar cita</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="small text-secondary" id="textoReprogramar"></p>
          <div id="avisoReprogramar" class="alert alert-danger d-none"></div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label for="nuevaFecha" class="form-label">Nueva fecha</label>
              <input type="date" class="form-control" id="nuevaFecha" required>
            </div>
            <div class="col-sm-6">
              <label for="nuevaHora" class="form-label">Nueva hora</label>
              <select class="form-select" id="nuevaHora" required><option value="">Elige la fecha</option></select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-verde">Guardar nuevo horario</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Ventana: confirmar (cancelar / eliminar) -->
  <div class="modal fade" id="modalConfirmar" tabindex="-1" aria-labelledby="tituloConfirmar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloConfirmar"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body"><p class="mb-0" id="textoConfirmar"></p></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Regresar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmar"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/menu-admin.js"></script>
  <script src="/js/autos.js"></script>
  <script src="/js/citas-comun.js"></script>
  <script src="/js/admin-citas.js"></script>
</body>
</html>
