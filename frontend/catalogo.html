<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de seminuevos | Seminuevos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/catalogo.css">
</head>
<body>
  <!-- Pantalla Catálogo de seminuevos (responsable: Persona 3). Pública. -->
  <header id="encabezado"></header>

  <main class="container py-4 py-md-5">
    <h1 class="titulo-pagina mb-4">Catálogo de seminuevos</h1>

    <!-- Buscador y filtros -->
    <form id="formFiltros" class="filtros p-3 p-md-4 mb-4" role="search">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-lg-4">
          <label for="q" class="form-label fw-semibold">Buscar</label>
          <input type="search" class="form-control" id="q" name="q" placeholder="Marca o modelo...">
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="marca" class="form-label">Marca</label>
          <select class="form-select" id="marca" name="marca">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="precioMax" class="form-label">Precio</label>
          <select class="form-select" id="precioMax" name="precioMax">
            <option value="">Cualquiera</option>
            <option value="350000">Hasta $350,000</option>
            <option value="400000">Hasta $400,000</option>
            <option value="500000">Hasta $500,000</option>
            <option value="600000">Hasta $600,000</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="anioMin" class="form-label">Año</label>
          <select class="form-select" id="anioMin" name="anioMin">
            <option value="">Cualquiera</option>
            <option value="2024">2024 o más nuevo</option>
            <option value="2022">2022 o más nuevo</option>
            <option value="2020">2020 o más nuevo</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <label for="orden" class="form-label">Ordenar</label>
          <select class="form-select" id="orden" name="orden">
            <option value="recientes">Más recientes</option>
            <option value="precio_asc">Menor precio</option>
            <option value="precio_desc">Mayor precio</option>
            <option value="anio_desc">Año más nuevo</option>
          </select>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-verde px-4">Buscar</button>
          <button type="button" class="btn btn-outline-secondary" id="btnLimpiar">Limpiar filtros</button>
        </div>
      </div>
    </form>

    <p class="text-secondary" id="conteo" aria-live="polite"></p>
    <div class="row g-3 g-md-4" id="resultados">
      <p class="text-secondary">Cargando unidades...</p>
    </div>
  </main>

  <footer id="pie"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/menu-sesion.js"></script>
  <script src="/js/autos.js"></script>
  <script src="/js/favorito.js"></script>
  <script src="/js/catalogo.js"></script>
</body>
</html>
