<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminuevos</title>
  <!--
    Página temporal de la Etapa 0 (responsable: Persona 1).
    Solo comprueba que el servidor y MySQL funcionan.
    Persona 2 la reemplaza con la pantalla de Inicio real.
  -->
  <style>
    body { font-family: system-ui, Arial, sans-serif; background: #f4f6f5; color: #1f2a24; margin: 0; padding: 48px 16px; }
    main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1 { margin-top: 0; color: #1d6b48; }
    .ok { color: #1d6b48; font-weight: bold; }
    .error { color: #b3261e; font-weight: bold; }
    code { background: #eef2f0; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Seminuevos: proyecto en construcción</h1>
    <p>Si ves esta página, el servidor Express está funcionando.</p>
    <p id="estado">Revisando la conexión con MySQL...</p>
    <ul id="conteo"></ul>
  </main>

  <script src="/js/api.js"></script>
  <script>
    (async () => {
      const estado = document.getElementById('estado');
      try {
        const salud = await api.get('/api/salud');
        if (salud.baseDeDatos !== 'ok') throw new Error(salud.detalle);
        estado.innerHTML = '<span class="ok">Conectado a MySQL (seminuevos_db).</span>';
        const r = salud.registros;
        document.getElementById('conteo').innerHTML =
          `<li>Automóviles: ${r.automoviles}</li><li>Usuarios: ${r.usuarios}</li><li>Citas: ${r.citas}</li>`;
      } catch (e) {
        estado.innerHTML = '<span class="error">Sin conexión con MySQL.</span> Revisa tu archivo <code>.env</code>. Detalle: ' + e.message;
      }
    })();
  </script>
</body>
</html>
