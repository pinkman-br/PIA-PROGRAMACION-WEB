<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Seminuevos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth">
  <!-- Pantalla Iniciar sesión (responsable: Persona 1) -->
  <main class="card auth-tarjeta">
    <div class="card-body p-4 p-md-5">
      <a href="/" class="auth-marca">Seminuevos</a>
      <h1 class="mt-3 mb-1">Iniciar sesión</h1>
      <p class="text-secondary mb-4">Entra para guardar favoritos y agendar pruebas de manejo.</p>

      <div id="aviso" class="alert d-none" role="alert"></div>

      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" autocomplete="email" required>
          <div class="invalid-feedback">Escribe un correo válido.</div>
        </div>
        <div class="mb-4">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="contrasena" name="contrasena" autocomplete="current-password" required>
          <div class="invalid-feedback">Escribe tu contraseña.</div>
        </div>
        <button type="submit" class="btn btn-verde w-100 py-2" id="btnEntrar">Entrar</button>
      </form>

      <p class="text-center mt-4 mb-0">¿No tienes cuenta? <a href="/registro">Crear cuenta</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
